[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/nielsbosma/OpenSign"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
print_stdout = "warn"

[workspace.dependencies]
opensign-crypto = { path = "crates/crypto" }
opensign-db = { path = "crates/db" }
opensign-core = { path = "crates/core" }
opensign-pdf = { path = "crates/pdf" }

aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "limit", "request-id", "timeout"] }
tracing = "0.1"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2 with production parameters takes seconds per hash unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
