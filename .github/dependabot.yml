# Weekly version updates, grouped so each ecosystem opens one PR. Security updates come separately
# as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The PDF crate's x509-cert 0.2 and cms 0.2 are built on spki 0.7; they move together once cms 0.3 is stable.
      - dependency-name: spki
        versions: [">=0.8"]
      # 0.3 and later need cms 0.3 and pkcs12 0.2, still pre-releases. Move with the PDF crate's cms stack.
      - dependency-name: p12-keystore
        versions: [">=0.3"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Typed to the Node major CI runs (24); move it together with CI's node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
