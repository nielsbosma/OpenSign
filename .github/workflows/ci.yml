name: CI

# Pull requests: lint, tests, supply-chain checks, independent validation of a sealed PDF, and an
# image smoke test (not pushed).
# main: the same, then a multi-arch image is pushed as ghcr.io/<owner>/opensign:edge.
# Releases: publishing a GitHub Release named vX.Y.Z pushes :X.Y.Z, :X.Y and :latest.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: ci-${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opensign
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opensign
          POSTGRES_PASSWORD: opensign
          POSTGRES_DB: opensign_test
        ports: ['5480:5432']
        options: >-
          --health-cmd "pg_isready -U opensign" --health-interval 2s --health-timeout 3s --health-retries 30
      converter:
        image: gotenberg/gotenberg:8
        ports: ['3320:3000']
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['8026:8025']
    env:
      TEST_DATABASE_URL: postgres://opensign:opensign@localhost:5480/opensign_test
      TEST_CONVERTER_URL: http://localhost:3320
      SEALED_PDF_OUT: ${{ github.workspace }}/sealed.pdf
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The sealed PDF passes independent validators
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
          qpdf --check sealed.pdf
          out=$(pdfsig sealed.pdf)
          echo "$out"
          grep -q "Total document signed" <<<"$out"
          grep -q "Signature is Valid" <<<"$out"
          grep -q "ETSI.CAdES.detached" <<<"$out"
      - name: The web app's API types match the server
        run: |
          node web/scripts/api-types.mjs
          git diff --exit-code web/src/lib/api-types.gen.ts

  supply-chain:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  web:
    name: Web lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter @opensign/web typecheck
      - run: pnpm --filter @opensign/web test
      - run: pnpm --filter @opensign/web build

  image:
    name: Image smoke test and publish
    needs: [rust, web, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          elif [[ -n "$RELEASE_TAG" ]]; then echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT";
          else echo "value=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - name: Build for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opensign:local
          build-args: OPENSIGN_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with Postgres, S3 and Gotenberg
        env:
          OPENSIGN_IMAGE: opensign:local
        run: |
          docker compose up -d --wait postgres s3 mailpit converter
          docker compose run --rm s3-init
          docker compose exec -T postgres psql -U opensign -c 'create database opensign_prod' || true
          docker compose --profile prod up -d --no-build app
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/api/ready && break; sleep 2; done
          curl -fsS http://localhost:8090/api/ready
          curl -fsSI http://localhost:8090/ | grep -i "content-security-policy"
          curl -fsS http://localhost:8090/.well-known/oauth-authorization-server | grep -q authorization_endpoint
          docker compose logs app | grep -q "setup code"
          test "$(docker inspect --format '{{.Config.User}}' opensign:local)" = nonroot
      - name: Logs
        if: failure()
        run: docker compose logs app | tail -200

      - name: Image tags
        id: tags
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ github.event_name }}" == release ]]; then
            echo "tags=$IMAGE:$VERSION,$IMAGE:${VERSION%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-arch image (amd64, arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: OPENSIGN_VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
