name: CI

# Pull requests: lint, tests, supply-chain checks, independent validation of a sealed PDF, and an
# image smoke test (not pushed).
# main: the same, then amd64 and arm64 are built on native runners and pushed as
# ghcr.io/<owner>/opensign:edge.
# Releases: publishing a GitHub Release named vX.Y.Z pushes :X.Y.Z, :X.Y and :latest, then calls the
# SLIPLANE_DEPLOY_HOOK secret if set (deploy/Connect-Github.ps1 sets it). The tag that comes with a
# release starts no run of its own, so each release is built once.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opensign
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opensign
          POSTGRES_PASSWORD: opensign
          POSTGRES_DB: opensign_test
        ports: ['5480:5432']
        options: >-
          --health-cmd "pg_isready -U opensign" --health-interval 2s --health-timeout 3s --health-retries 30
      converter:
        image: gotenberg/gotenberg:8
        ports: ['3320:3000']
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['8026:8025']
    env:
      TEST_DATABASE_URL: postgres://opensign:opensign@localhost:5480/opensign_test
      TEST_CONVERTER_URL: http://localhost:3320
      SEALED_PDF_OUT: ${{ github.workspace }}/sealed.pdf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The sealed PDF passes independent validators
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
          qpdf --check sealed.pdf
          out=$(pdfsig sealed.pdf)
          echo "$out"
          grep -q "Total document signed" <<<"$out"
          grep -q "Signature is Valid" <<<"$out"
          grep -q "ETSI.CAdES.detached" <<<"$out"
      - name: The web app's API types match the server
        run: |
          node web/scripts/api-types.mjs
          git diff --exit-code web/src/lib/api-types.gen.ts

  supply-chain:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  web:
    name: Web lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter @opensign/web typecheck
      - run: pnpm --filter @opensign/web test
      - run: pnpm --filter @opensign/web build

  image:
    name: Image smoke test and publish
    needs: [rust, web, supply-chain]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT";
          else echo "value=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build for testing (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: opensign:local
          build-args: OPENSIGN_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Smoke test with Postgres, S3 and Gotenberg
        env:
          OPENSIGN_IMAGE: opensign:local
        run: |
          docker compose up -d --wait postgres s3 mailpit converter
          docker compose run --rm s3-init
          docker compose exec -T postgres psql -U opensign -c 'create database opensign_prod' || true
          docker compose --profile prod up -d --no-build app
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/api/ready && break; sleep 2; done
          curl -fsS http://localhost:8090/api/ready
          curl -fsSI http://localhost:8090/ | grep -i "content-security-policy"
          curl -fsS http://localhost:8090/.well-known/oauth-authorization-server | grep -q authorization_endpoint
          docker compose logs app | grep -q "setup code"
          test "$(docker inspect --format '{{.Config.User}}' opensign:local)" = nonroot
      - name: Logs
        if: failure()
        run: docker compose logs app | tail -200

  build:
    name: Build ${{ matrix.arch }}
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: OPENSIGN_VERSION=${{ needs.image.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the image
    needs: [image, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image (amd64, arm64)
        working-directory: digests
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest")
          else
            tags=(-t "$IMAGE:edge")
          fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Deploy to Sliplane
        if: github.event_name == 'release'
        env:
          DEPLOY_HOOK: ${{ secrets.SLIPLANE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then echo "No SLIPLANE_DEPLOY_HOOK secret, skipping the deploy."; exit 0; fi
          curl -fsS -o /dev/null --retry 3 "$DEPLOY_HOOK"
          echo "Sliplane is redeploying the service's tag."
