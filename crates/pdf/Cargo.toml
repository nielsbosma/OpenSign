[package]
name = "opensign-pdf"
description = "PDF sanitizing, field stamping, evidence pages and PAdES sealing."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
const-oid = { version = "0.9", features = ["db"] }
cms = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std", "derive", "oid"] }
ecdsa = { version = "0.16", features = ["der", "signing", "verifying"] }
flate2 = "1"
hex = { workspace = true }
lopdf = { version = "0.46", default-features = false }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p256-ct = { package = "p256", version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rand = { workspace = true }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
signature = { version = "2", features = ["std"] }
signature-ct = { package = "signature", version = "3" }
spki = { version = "0.7", features = ["std"] }
thiserror = { workspace = true }
x509-cert = { version = "0.2", features = ["builder", "std"] }
x509-ocsp = { version = "0.2.1", default-features = false }
