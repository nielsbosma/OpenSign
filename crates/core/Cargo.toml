[package]
name = "opensign-core"
description = "Services, permissions, audit, settings, auth, storage, email and jobs. Every surface calls into this."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
opensign-crypto = { workspace = true }
opensign-db = { workspace = true }
opensign-pdf = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
reqwest = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
x509-cert = { version = "0.2", features = ["pem"] }
p12-keystore = "0.2"
uuid = { workspace = true }

[features]
testing = ["opensign-db/testing"]

[dev-dependencies]
rand = { workspace = true }
opensign-core = { path = ".", features = ["testing"] }
lopdf = { version = "0.46", default-features = false }
axum = { workspace = true }
