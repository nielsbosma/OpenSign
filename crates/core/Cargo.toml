[package]
name = "opensign-core"
description = "Services, permissions, audit, settings, auth, storage, email and jobs. Every surface calls into this."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
opensign-crypto = { workspace = true }
opensign-db = { workspace = true }
opensign-pdf = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
ipnet = "2"
hmac = { workspace = true }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
reqwest = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
x509-cert = { version = "0.2", features = ["pem"] }
p12-keystore = "0.2"
png = "0.17"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
jpeg-decoder = { version = "0.3", default-features = false }
uuid = { workspace = true }
csv = "1.4.0"
calamine = { version = "0.37.0", features = ["chrono"] }
encoding_rs = "0.8.42"
zip = { version = "9", default-features = false }
ciborium = "0.2.2"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
md-5 = "0.10"

[features]
testing = ["opensign-db/testing"]

[dev-dependencies]
rand = { workspace = true }
opensign-core = { path = ".", features = ["testing"] }
lopdf = { version = "0.46", default-features = false }
axum = { workspace = true }
